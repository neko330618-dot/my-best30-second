const people = [

  {

  {

const grid = document.getElementById("grid");
const count = document.getElementById("count");
const empty = document.getElementById("empty");
const search = document.getElementById("search");

const viewer = document.getElementById("viewer");
const viewerImage = document.getElementById("viewerImage");

function openPhoto(person) {
  if (!person.photo) return;
  viewerImage.src = person.photo;
  viewerImage.alt = person.name;
  viewer.classList.add("active");
}

function closePhoto() {
  viewer.classList.remove("active");
  viewerImage.src = "";
}

document.getElementById("close")
  .addEventListener("click", closePhoto);

viewer.addEventListener("click", event => {
  if (event.target === viewer) closePhoto();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closePhoto();
});

function makeCard(person) {
  const card = document.createElement("article");
  card.className = "card";

  const photo = document.createElement("div");
  photo.className = "photo";

  if (person.photo) {
    const image = document.createElement("img");
    image.src = person.photo;
    image.alt = person.name;
    image.loading = "lazy";
    photo.appendChild(image);
    photo.addEventListener("click", () => openPhoto(person));
  } else {
    photo.textContent = "写真未登録";
    photo.style.cursor = "default";
  }

  const meta = document.createElement("div");
  meta.className = "meta";

  const rank = document.createElement("div");
  rank.className = "rank";
  rank.textContent = "NO. " + person.rank;

  const name = document.createElement("a");
  name.className = "name";
  name.textContent = person.name;

  if (person.link) {
    name.href = person.link;
    name.target = "_blank";
    name.rel = "noopener noreferrer";
  }

  meta.append(rank, name);
  card.append(photo, meta);

  return card;
}

function draw() {
  grid.replaceChildren();

  const query = search.value.trim();

  const filtered = people
    .filter(person => person.name.includes(query))
    .sort((a, b) => a.rank - b.rank);

  count.textContent = "登録メンバー：" + people.length + "人";

  empty.hidden = filtered.length !== 0;

  filtered.forEach(person => {
    grid.appendChild(makeCard(person));
  });
}

search.addEventListener("input", draw);

draw();
</script>
